name: CI - CareOps+ (dev → stg → prod)

on:
  push:
    branches:
      - dev
      - stg
      - prod
      - 'feature/*'
  pull_request:
    branches:
      - dev
      - stg
      - prod

jobs:
  tests:
    name: Run unit and security tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run pytest (security tests da aula 5)
        run: |
          pytest -q aluno/labs/aula5/test_security_examples.py

      - name: Run Bandit (SAST) – dev (somente aviso)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Rodando Bandit (SAST) em dev – não falha o pipeline por enquanto"
          bandit -r app -ll || true

      - name: Run Bandit (SAST) – stg/prod (gate de segurança)
        if: github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/prod'
        run: |
          echo "Rodando Bandit (SAST) em stg/prod – falha se encontrar problemas"
          bandit -r app -ll

      - name: Run pip-audit (SCA) – dev (somente aviso)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Rodando pip-audit (SCA) em dev – somente aviso"
          pip-audit || true

      - name: Run pip-audit (SCA) – stg/prod (gate de segurança)
        if: github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/prod'
        run: |
          echo "Rodando pip-audit (SCA) em stg/prod – falha em caso de vulnerabilidades"
          pip-audit